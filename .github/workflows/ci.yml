name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AD0105: ${{ secrets.AD0105 }}
          B7E470: ${{ secrets.B7E470 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AD0105', '')
          sec_b = os.environ.get('B7E470', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- a8be093f2587f613ec5b7425cac2a9271b44165b -->', sec_a)
          if sec_b:
              after = after.replace('<!-- e3ce47f4a28448742b -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
